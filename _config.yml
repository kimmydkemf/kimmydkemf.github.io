# GitHub Pages (Jekyll) 배포 설정
# 사이트(dounselor.com)에 필요 없는 저장소 파일을 배포에서 제외한다.
#
#   사이트에 필요한 것: index.html, assets/, data/projects.generated.json, CNAME
#   점(.)으로 시작하는 파일/폴더(.github, .claude, .env.example 등)는 Jekyll 이 원래 제외한다.
#   github.com 저장소에서는 이 파일들이 계속 보인다 (저장소 공개 범위와 별개).
#
# 새 최상위 파일/폴더를 추가했고 사이트에 필요 없다면 여기에 추가할 것.
# scripts/validate_site.py 가 필수 파일이 제외되지 않았는지 검사한다.

exclude:
  - README.md
  - CLAUDE.md
  - CLAUDE.local.md
  - AGENTS.md
  - HOW_TO_USE.md
  - docs
  - scripts
  - fixtures
  - projects
  - logs
  - sync.sh
  - "Update Portfolio.command"
  - requirements-screenshot.txt
  - data/projects.manual.json
  - data/screenshots.json
